<!doctype html>
<html lang={{lang}}>
<head>
<meta charset=utf-8>
<title>{{title}}</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=theme-color content=#07060a>
<style>
/* The class on <body> is the state of the page:
   l = loading, m = menu, g = in the scene (g p while the mouse is captured), l e = failed to start */
html { background: #07060a; }
body {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; margin: 0; overflow: hidden;
  background: radial-gradient(#231a14, #07060a 70%);
  font: 600 clamp(13px, .7vw + .9vh, 36px)/1.4 system-ui, sans-serif; color: #e9e4dc;
  -webkit-user-select: none; user-select: none;
}
/* a phone held upright gets the whole page turned on its side, so the scene is always landscape */
@media (orientation: portrait) and (pointer: coarse) {
  body { width: 100dvh; height: 100dvw; transform-origin: 0 0; transform: rotate(90deg) translateY(-100%); }
}

/* the scene: blurred and dimmed behind the menu, comes into focus when you step to the window */
canvas {
  position: absolute; width: 100%; height: 100%; touch-action: none; cursor: crosshair;
  transition: filter 1s, transform 1s, opacity 2s;
}
body:not(.g) canvas { filter: blur(1vmax) brightness(.6); transform: scale(1.06); }
.l canvas { opacity: 0; }

/* menu: the loading bar and the buttons share one grid cell, so nothing jumps when they swap */
#m {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: min(2.2em, 6vmin);
  padding: 1em 1em 4.5em; text-align: center; background: radial-gradient(#07060a00 30%, #07060acc);
  transition: opacity .5s, visibility .5s;
}
.g #m, .m #l, .l #g { opacity: 0; visibility: hidden; }
h1 {
  margin: 0; font: 900 4.4em/1 system-ui, sans-serif; letter-spacing: .3em; text-indent: .3em; text-transform: uppercase;
  color: #0000; background: linear-gradient(#f4f1ea 30%, #b9ab98 65%, #5d5146);
  -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 .06em .2em #000c);
}
p { margin: 0; }
#a { display: grid; width: 27em; max-width: 100%; }
#a > * { grid-area: 1/1; transition: opacity .8s, visibility .8s; }
#s, #w, #q, #k, #h { font-size: .8em; letter-spacing: .12em; text-transform: uppercase; }
#w { margin-top: 1.2em; color: #ffc98a; text-wrap: balance; }

/* loading bar */
#p {
  height: .5em; margin: .4em 0 1em; overflow: hidden; border-radius: 1em; background: #07060a;
  box-shadow: 0 0 0 2px #ffc98a66, 0 0 1.5em #a8642a;
}
#b {
  display: block; height: 100%; background: linear-gradient(90deg, #a8642a, #ffe2b8);
  transform: scaleX(0); transform-origin: 0; will-change: transform;
}
.e #p { visibility: hidden; }
.e #s { font-size: 1.1em; letter-spacing: 0; text-transform: none; }

/* buttons */
button {
  display: flex; align-items: center; justify-content: center; gap: .6em; padding: .8em 1.4em; border: 0;
  border-radius: .5em; background: #e9e4dc; box-shadow: inset 0 -.2em #0003, 0 .3em 1em #0009;
  font: 800 1em/1.2 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; text-decoration: none;
  color: #17120e; cursor: pointer; transition: transform .12s, filter .12s;
}
button:hover { transform: translateY(-.12em); filter: brightness(1.15); }
button:active { transform: translateY(.1em); filter: brightness(.9); }
:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
#g { display: grid; gap: min(1.2em, 3.5vmin); }
#d {
  padding: .9em; background: linear-gradient(#ffe6c2, #f0a653); font-size: 1.3em;
  box-shadow: inset 0 -.2em #0003, 0 0 2em #f0a65380;
}

/* the link to the source: always at the bottom of the menu */
#f { position: absolute; left: 0; right: 0; bottom: 1.2em; display: flex; justify-content: center; font-size: .8em; letter-spacing: .12em; text-transform: uppercase; }
#f a {
  display: flex; align-items: center; gap: .6em; padding: .5em .9em; border-radius: .5em;
  color: #e9e4dc; text-decoration: none; opacity: .65; transition: opacity .12s, background .12s;
}
#f a:hover { opacity: 1; background: #ffc98a22; }
svg { width: 1.4em; height: 1.4em; fill: currentColor; }

/* dark plates under the main button: detail level, list of controls, touch hint */
#q, #k, #h { padding: 1em 1.6em; border-radius: .7em; background: #07060ab3; }

/* detail level: three buttons in a row, the current one lit */
#q { display: flex; align-items: center; gap: .4em; padding: .4em; }
#q span { flex: 1; color: #ffc98a; }
#q button { flex: 1.2; padding: .7em 0; background: none; box-shadow: none; color: #e9e4dc; }
#q button:hover { background: #ffc98a33; }
#q .on { background: linear-gradient(#ffe6c2, #f0a653); box-shadow: inset 0 -.2em #0003; color: #17120e; pointer-events: none; }

/* list of controls: two groups, key caps right-aligned against their labels */
#k { display: flex; justify-content: center; gap: 2em; text-align: left; }
#k p { display: grid; grid-template-columns: auto auto; align-content: start; align-items: center; gap: .55em .9em; }
#k p + p { padding-left: 2em; border-left: 2px solid #ffc98a40; }
#k i { display: flex; justify-self: end; align-items: center; gap: .25em; font-style: normal; }
#k b {
  min-width: 1.1em; padding: .2em .5em; border-radius: .35em; background: #e9e4dc;
  box-shadow: inset 0 -.15em #0004; color: #17120e; text-align: center;
}
#h { display: none; }
@media (pointer: coarse), (max-height: 30em) {
  #k { display: none; }
}
@media (pointer: coarse) {
  #h { display: block; }
}

/* in the scene: a small menu button (hidden while the mouse is captured, Esc does the same) and the stats line */
#o {
  position: absolute; top: .6em; right: .6em; display: none; padding: .3em .6em; background: #17120ed9;
  box-shadow: inset 0 0 0 2px #ffc98a, 0 .3em 1em #0009; font-size: 1.3em; color: #e9e4dc; opacity: .8;
}
.g #o { display: flex; }
.p #o { display: none; }
#i {
  position: absolute; top: 1em; left: 1.2em; margin: 0; font: .8em/1.6 ui-monospace, Consolas, monospace;
  white-space: pre-wrap; text-shadow: 0 1px 4px #000; pointer-events: none;
}
</style>
</head>
<body class=l>
<canvas id=c></canvas>
<div id=m>
  <h1>{{title}}</h1>
  <div id=a>
    <div id=l><div id=p><i id=b></i></div><p id=s>{{night}}</p><p id=w hidden>{{chrome}}</p></div>
    <div id=g>
      <button id=d>{{go}}</button>
      <p id=q><span>{{detail}}</span><button>{{low}}</button><button>{{medium}}</button><button>{{high}}</button></p>
      <div id=k>
        <p>
          <i><b>W</b><b>A</b><b>S</b><b>D</b></i>{{fly}}
          <i><b>Q</b><b>E</b></i>{{updown}}
          <i><b>Shift</b></i>{{faster}}
          <i><b>1</b>-<b>6</b></i>{{views}}
        </p>
        <p>
          <i><b>Esc</b></i>{{menu}}
          <i><b>M</b></i>{{sound}}
          <i><b>H</b></i>{{stats}}
        </p>
      </div>
      <p id=h>{{touch}}</p>
    </div>
  </div>
  <p id=f><a href=https://github.com/tazumi/htone target=_blank rel=noopener><svg viewBox="0 0 16 16"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>{{repo}}</a></p>
</div>
<button id=o aria-label="{{menu}}">≡</button>
<pre id=i></pre>
<script>
/*SCRIPT*/
</script>
</body>
</html>
